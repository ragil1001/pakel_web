name: Replace unserved video assets with repository media

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-unserved-video-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pakel source
        uses: actions/checkout@v4

      - name: Replace failing hero video with an existing repository photo
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Homepage.jsx')
          source = path.read_text(encoding='utf-8')

          hero_pattern = re.compile(
              r'''<video\n\s+className="w-full h-full object-cover transform-gpu".*?</video>''',
              re.DOTALL,
          )
          hero_replacement = '''<img
            src="/profil/profil1.jpg"
            alt="Pemandangan asli Padukuhan Pakel"
            className="w-full h-full object-cover transform-gpu"
            loading="eager"
          />'''

          updated, hero_count = hero_pattern.subn(hero_replacement, source, count=1)
          if hero_count != 1:
              raise SystemExit(f'Expected one hero video block, replaced {hero_count}')

          updated = updated.replace(
              'onClick={handleVideoOpen}\n                  className="relative flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-white/60 backdrop-blur-sm"',
              'disabled\n                  aria-disabled="true"\n                  title="Video dokumenter belum tersedia pada deployment publik"\n                  className="relative flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-white/30 opacity-60 cursor-not-allowed"',
              1,
          )
          updated = updated.replace(
              'Tonton Dokumenter',
              'Dokumenter belum tersedia',
              1,
          )

          if updated == source:
              raise SystemExit('No source changes were produced')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify the public hero no longer references the failing video
        run: |
          if grep -n 'source src="/videos/hero.mp4"' src/Homepage.jsx; then
            echo "The failing hero video reference remains"
            exit 1
          fi
          grep -n 'src="/profil/profil1.jpg"' src/Homepage.jsx
          grep -n 'Dokumenter belum tersedia' src/Homepage.jsx

      - name: Commit the source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Homepage.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: replace unserved Pakel videos with repository media"
          git push
