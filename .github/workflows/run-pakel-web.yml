name: Capture Original PAKEL Through Vite Preview

on:
  push:
    branches:
      - chatgpt/deploy-pakel-web
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build original React application
        shell: bash
        run: |
          npm ci
          npm run build
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Start original Vite preview
        shell: bash
        run: |
          mkdir -p runtime/screenshots
          npm run preview -- --host 127.0.0.1 --port 4173 > runtime/server.log 2>&1 &
          echo $! > runtime/server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat runtime/server.log
          exit 1

      - name: Capture final home views and media diagnostics
        shell: bash
        run: |
          cat > capture-final.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const executablePath = execSync(
            'command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium',
            { encoding: 'utf8' }
          ).trim();

          const browser = await puppeteer.launch({
            executablePath,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--autoplay-policy=no-user-gesture-required']
          });
          const page = await browser.newPage();
          const consoleErrors = [];
          const failedRequests = [];
          page.on('console', msg => {
            if (msg.type() === 'error') consoleErrors.push(`console: ${msg.text()}`);
          });
          page.on('pageerror', error => consoleErrors.push(`pageerror: ${error.message}`));
          page.on('requestfailed', request => {
            failedRequests.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'failed'}`);
          });

          async function capture(viewport, file, fullPage) {
            await page.setViewport(viewport);
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(
              () => document.querySelectorAll('a[href^="/umkm/"]').length > 0 &&
                    document.querySelectorAll('a[href^="/blog/"]').length > 0,
              { timeout: 30000 }
            );
            await new Promise(resolve => setTimeout(resolve, 12000));
            await page.screenshot({ path: `runtime/screenshots/${file}`, fullPage });
            return await page.evaluate(() => ({
              title: document.title,
              errorShown: document.body.innerText.includes('Gagal memuat data'),
              documentaryUnavailable: document.body.innerText.includes('Dokumenter belum tersedia'),
              umkmLinks: document.querySelectorAll('a[href^="/umkm/"]').length,
              blogLinks: document.querySelectorAll('a[href^="/blog/"]').length,
              videos: [...document.querySelectorAll('video')].map(video => ({
                srcAttribute: video.getAttribute('src'),
                currentSrc: video.currentSrc,
                readyState: video.readyState,
                networkState: video.networkState,
                paused: video.paused,
                errorCode: video.error?.code || null,
                videoWidth: video.videoWidth,
                videoHeight: video.videoHeight
              }))
            }));
          }

          const desktop = await capture(
            { width: 1440, height: 1000, deviceScaleFactor: 1 },
            'pakel-home-final-desktop.png',
            false
          );
          const mobile = await capture(
            { width: 430, height: 932, deviceScaleFactor: 1 },
            'pakel-home-final-mobile.png',
            true
          );

          writeFileSync('runtime/final-state.json', JSON.stringify({ desktop, mobile }, null, 2));
          writeFileSync('runtime/browser-errors.json', JSON.stringify(consoleErrors, null, 2));
          writeFileSync('runtime/failed-requests.json', JSON.stringify(failedRequests, null, 2));

          if (desktop.errorShown || mobile.errorShown) throw new Error('Firebase data failed to render');
          if (desktop.umkmLinks === 0 || desktop.blogLinks === 0) throw new Error('Firebase records were not rendered');

          await browser.close();
          NODE
          node capture-final.mjs

      - name: Verify final screenshots
        shell: bash
        run: |
          test -s runtime/screenshots/pakel-home-final-desktop.png
          test -s runtime/screenshots/pakel-home-final-mobile.png
          jq -e '.desktop.umkmLinks > 0 and .desktop.blogLinks > 0' runtime/final-state.json

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          test -f runtime/server.pid && kill "$(cat runtime/server.pid)" || true

      - name: Upload final runtime capture
        uses: actions/upload-artifact@v4
        with:
          name: pakel_web-final-runtime-capture
          path: runtime
          retention-days: 90
