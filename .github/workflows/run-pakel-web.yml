name: Capture Original PAKEL Video Assets

on:
  push:
    branches:
      - chatgpt/deploy-pakel-web
  workflow_dispatch:

jobs:
  verify-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build original React application
        shell: bash
        run: |
          npm ci
          npm run build
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0 serve@14.2.4

      - name: Start original Vite build
        shell: bash
        run: |
          mkdir -p runtime/screenshots
          npx serve -s dist -l 4173 > runtime/server.log 2>&1 &
          echo $! > runtime/server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat runtime/server.log
          exit 1

      - name: Capture home with original video files enabled
        shell: bash
        run: |
          cat > capture-video.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const executablePath = execSync(
            'command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium',
            { encoding: 'utf8' }
          ).trim();

          const browser = await puppeteer.launch({
            executablePath,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--autoplay-policy=no-user-gesture-required']
          });

          const page = await browser.newPage();
          const errors = [];
          const failedRequests = [];
          page.on('console', msg => {
            if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
          });
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('requestfailed', request => {
            const failure = request.failure();
            failedRequests.push(`${request.method()} ${request.url()} :: ${failure?.errorText || 'failed'}`);
          });

          async function openHome(viewport, file, fullPage) {
            await page.setViewport(viewport);
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 90000
            });
            await page.waitForFunction(
              () => document.querySelectorAll('a[href^="/umkm/"]').length > 0 &&
                    document.querySelectorAll('a[href^="/blog/"]').length > 0,
              { timeout: 30000 }
            );
            await page.waitForFunction(
              () => [...document.querySelectorAll('video')].some(video => video.readyState >= 2),
              { timeout: 120000 }
            );
            await new Promise(resolve => setTimeout(resolve, 2500));
            await page.screenshot({ path: `runtime/screenshots/${file}`, fullPage });
            return await page.evaluate(() => ({
              errorShown: document.body.innerText.includes('Gagal memuat data'),
              documentaryUnavailable: document.body.innerText.includes('Dokumenter belum tersedia'),
              videos: [...document.querySelectorAll('video')].map(video => ({
                currentSrc: video.currentSrc,
                readyState: video.readyState,
                networkState: video.networkState,
                paused: video.paused,
                errorCode: video.error?.code || null,
                width: video.videoWidth,
                height: video.videoHeight
              }))
            }));
          }

          const desktop = await openHome(
            { width: 1440, height: 1000, deviceScaleFactor: 1 },
            'pakel-home-video-desktop.png',
            false
          );
          const mobile = await openHome(
            { width: 430, height: 932, deviceScaleFactor: 1 },
            'pakel-home-video-mobile.png',
            true
          );

          writeFileSync('runtime/video-state.json', JSON.stringify({ desktop, mobile }, null, 2));
          writeFileSync('runtime/browser-errors.json', JSON.stringify(errors, null, 2));
          writeFileSync('runtime/failed-requests.json', JSON.stringify(failedRequests, null, 2));

          if (desktop.errorShown || mobile.errorShown) throw new Error('Firebase data failed to render');
          if (![...desktop.videos, ...mobile.videos].some(video => video.readyState >= 2 && !video.errorCode)) {
            throw new Error('Original video assets did not become playable');
          }
          if (failedRequests.some(item => item.includes('/videos/'))) {
            throw new Error('A local video request failed');
          }

          await browser.close();
          NODE
          node capture-video.mjs

      - name: Verify corrected screenshots
        shell: bash
        run: |
          test -s runtime/screenshots/pakel-home-video-desktop.png
          test -s runtime/screenshots/pakel-home-video-mobile.png
          jq -e '([.desktop.videos[], .mobile.videos[]] | any(.readyState >= 2 and .errorCode == null))' runtime/video-state.json

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          test -f runtime/server.pid && kill "$(cat runtime/server.pid)" || true

      - name: Upload corrected runtime capture
        uses: actions/upload-artifact@v4
        with:
          name: pakel_web-video-corrected-capture
          path: runtime
          retention-days: 90
